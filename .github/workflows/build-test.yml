name: Build & Test

# Trigger policy:
#   - push to main only            (validates merge integrity, no double-run)
#   - pull_request open/sync       (covers all feature-branch development)
#   - workflow_call                (release.yml gates on this passing)
#
# Path filter: only fires for kernel/userspace source changes or run.sh.
# Everything else - docs, licences, workflow metadata, Docker files, helper
# scripts, issue templates, and planning notes - is intentionally skipped.

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'run.sh'
  pull_request:
    paths:
      - 'src/**'
      - 'run.sh'

# Cancel superseded runs on the same ref so a rebased push doesn't keep CI
# burning cycles for the older commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build kernel + ISOs + HDD test image once, fan out tests as artifacts ──
  # Runs on the host runner (not in a container) because generate-hdd.sh
  # spawns its own privileged docker container for loop-device work, which
  # is awkward to nest.  Subsequent test jobs run inside the container.
  # KVM acceleration is deliberately disabled (see run.sh _qemu_accel).
  build:
    name: Build (kernel + ISOs + HDD test image)
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: '1'
      CCACHE_MAXSIZE: 500M
      # CI scratch HDD size -- must match MAKAR_HDD_TEST_SIZE_MB in run.sh.
      # Release HDDs use MAKAR_HDD_SIZE_MB (256) via generate-hdd.sh's
      # default; this 64 MiB image is the CI / gdb-hdd test artifact.
      HDD_SIZE_MB: 96
      MAKAR_HDD_TEST_SIZE_MB: 96

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-main-
            ccache-${{ runner.os }}-

      - name: Build ISOs (kernel + makar.iso + makar-test.iso)
        run: |
          mkdir -p ci-logs
          set -o pipefail
          # TEST_ISO=1 so the build job also emits makar-test.iso for the
          # downstream artifact (local `iso build` skips it -- one ISO, faster).
          TEST_ISO=1 ./run.sh iso build 2>&1 | tee ci-logs/iso-build.log

      - name: Build HDD test image (kernel cached from ISO build)
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./run.sh hdd build 2>&1 | tee ci-logs/hdd-build.log

      - name: ccache stats
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e CCACHE_DIR=/work/.ccache \
            makar-build:local ccache -s 2>&1 | tee ci-logs/ccache-stats.log || echo "(ccache stats unavailable)"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ci-logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: makar-build
          path: |
            src/kernel/makar.kernel
            makar.iso
            makar-test.iso
            makar-hdd-test.img
          retention-days: 1
          if-no-files-found: error

  # ── ktest suite (in-kernel unit tests + ring-3 lifecycle) ──────────────────
  # The fastest test job: ~30s on KVM.  Boots makar-test.iso whose grub.cfg
  # autoselects the test_mode entry; the kernel runs ktest_run_all() then
  # exits QEMU via isa-debug-exit.  PASS/FAIL is grepped from serial.
  ktest:
    name: ktest
    needs: build
    runs-on: ubuntu-latest
    container:
      image: arawn780/gcc-cross-i686-elf:fast
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: makar-build

      - name: Run ktest
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./run.sh ktest 2>&1 | tee ci-logs/ktest-run.log

      - name: Upload ktest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktest-log
          path: |
            ci-logs/
            ktest.log
          if-no-files-found: warn

  # ── GUI smoke test (window server boots + draws) ───────────────────────────
  # Boots straight into the GUI desktop (autoboot=gui + autologin), waits for
  # gui.elf's "GUI: READY" serial marker, captures a QEMU screendump (uploaded
  # as a BMP artifact), then shuts down.  The marker is the pass gate.
  guitest:
    name: guitest
    needs: build
    runs-on: ubuntu-latest
    container:
      image: arawn780/gcc-cross-i686-elf:fast
    defaults:
      run:
        shell: bash
    env:
      GUITEST_TIMEOUT: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: makar-build

      - name: Run guitest
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./run.sh guitest 2>&1 | tee ci-logs/guitest-run.log

      - name: Upload guitest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guitest-screendump
          path: |
            ci-logs/
            guitest.log
            gui-screendump.bmp
            gui-screendump.ppm
          if-no-files-found: warn

  # ── GUI headless self-tests (own section, away from the kernel ktests) ─────
  # Boots makar-test.iso with test=gui-smoke so the kernel runs ONLY the
  # framebuffer-free GUI/desktop self-tests (gui.elf uitest/fstest/desktest via
  # /src/userspace/gui-smoke.sh) and skips every other suite.  Deterministic and
  # fast: no host input, no screen scraping -- it asserts on the GUI-SMOKE serial
  # marker.  Distinct from `guitest` (which checks the GUI *boots* + screendumps).
  gui-headless:
    name: GUI headless self-tests
    needs: build
    runs-on: ubuntu-latest
    container:
      image: arawn780/gcc-cross-i686-elf:fast
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: makar-build

      - name: Run GUI headless self-tests
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./run.sh guismoke 2>&1 | tee ci-logs/gui-headless-run.log

      - name: Upload GUI headless log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-headless-log
          path: |
            ci-logs/
            ktest.log
          if-no-files-found: warn

  # ── kbtest: in-guest keyboard-injection test ───────────────────────────────
  # Boots makar.iso with `kbtest` on the cmdline into the normal shell; the
  # kernel's keyboard_test_driver injects keycodes straight into the live
  # decode -> focus-router -> task-ring -> shell path (no host typing) and emits
  # KBTEST serial markers.  Deterministic; the only sanctioned transient is the
  # documented `exec: missing params (kernel bug)` arg race, which we re-run once
  # (exactly the local workaround) -- any other failure is real.
  kbtest:
    name: kbtest (keyboard injection)
    needs: build
    runs-on: ubuntu-latest
    container:
      image: arawn780/gcc-cross-i686-elf:fast
    defaults:
      run:
        shell: bash
    env:
      # Boot-to-shell + injection under TCG (no KVM on GHA runners) is slower
      # than the local KVM path; give the poll loop generous headroom.
      KBTEST_TIMEOUT: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run kbtest
        run: |
          mkdir -p ci-logs
          set -o pipefail
          attempt() { ./run.sh kbtest 2>&1 | tee ci-logs/kbtest-run.log; }
          if attempt; then exit 0; fi
          # Re-run once ONLY for the known exec arg race; otherwise fail.
          if grep -q "exec: missing params" kbtest.log ci-logs/kbtest-run.log 2>/dev/null; then
            echo "::warning::kbtest hit the known exec-race (missing params); retrying once"
            attempt
          else
            echo "kbtest failed for a non-transient reason"; exit 1
          fi

      - name: Upload kbtest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kbtest-log
          path: |
            ci-logs/
            kbtest.log
          if-no-files-found: warn

  # ── GDB ISO boot-checkpoint test ───────────────────────────────────────────
  # Boots makar.iso (interactive grub.cfg; the GUI desktop is the default
  # entry) under the QEMU
  # GDB stub and verifies Multiboot 2 magic, boot checkpoints, hardware
  # state, VESA TTY init, background ktest result, and CD-ROM content.
  gdb-iso:
    name: GDB ISO boot
    needs: build
    runs-on: ubuntu-latest
    container:
      image: arawn780/gcc-cross-i686-elf:fast
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: makar-build

      - name: Run GDB ISO boot test
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./run.sh gdb iso 2>&1 | tee ci-logs/gdb-iso-run.log

      - name: Upload GDB logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdb-iso-logs
          path: |
            ci-logs/
            gdb-test.log
            gdb-serial.log
          if-no-files-found: warn

  # ── GDB HDD boot test ──────────────────────────────────────────────────────
  # Boots makar-hdd-test.img (no CD-ROM) and verifies the kernel reaches
  # shell_run with fat32_mounted() non-zero -- proves GRUB-from-FAT32 boot
  # and the IDE/FAT32 auto-mount path.
  gdb-hdd:
    name: GDB HDD boot
    needs: build
    runs-on: ubuntu-latest
    container:
      image: arawn780/gcc-cross-i686-elf:fast
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: makar-build

      - name: Run GDB HDD boot test
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./run.sh gdb hdd 2>&1 | tee ci-logs/gdb-hdd-run.log

      - name: Upload GDB logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdb-hdd-logs
          path: |
            ci-logs/
            hdd-test-gdb.log
            hdd-test-serial.log
          if-no-files-found: warn

  # NOTE: user-facing coverage is in-guest and headless.  In CI:
  #   - the GUI/desktop self-tests run in the `gui-headless` job (test=gui-smoke);
  #   - the keyboard pipeline runs in the `kbtest` job (in-guest key injection);
  #   - the shell/VFS/apps + libc/TCC script drivers (shell-smoke / incore /
  #     libc-tcc) run locally via `./run.sh iso test` -- they are NOT in this
  #     workflow because the in-OS TCC self-rebuild is slow under TCG (no KVM on
  #     GHA runners) and the exec-heavy drivers are flake-prone; they stay a
  #     local pre-merge gate.
  # There is no host-driven keyboard path -- kbtest injects keycodes inside the
  # guest, asserting on serial markers.
