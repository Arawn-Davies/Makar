title: Makar
description: >-
  A bare-metal i686 hobby OS in C — preemptive 100 Hz scheduler, 4-TTY
  multitasking shell, FAT32 + ISO9660 + synthetic /proc, ring-3 ELF
  userspace, VIX editor.  Sibling project of Medli (C# / Cosmos).

theme: just-the-docs

url: https://arawn-davies.co.uk
baseurl: /makar

color_scheme: dark
search_enabled: true
heading_anchors: true

aux_links:
  "View on GitHub":
    - "https://github.com/Arawn-Davies/makar"

enable_copy_code_button: true
aux_links_new_tab: true

plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
