title: Makar
description: >-
  A bare-metal i686 hobby OS in C — preemptive 250 Hz multitasking, a makx
  GUI desktop, ext2 + FAT32 + ISO9660 + synthetic /proc, networking (lwIP),
  ring-3 ELF userspace with an in-OS C compiler.  Sibling of Medli (C# / Cosmos).

# Remote theme so the native GitHub Pages build (Deploy from a branch, /docs)
# can resolve just-the-docs without a Gemfile — same setup as the Medli3 site
# (unpinned = latest, matching Medli3).
remote_theme: just-the-docs/just-the-docs

url: https://arawn-davies.co.uk
baseurl: /makar

color_scheme: dark
search_enabled: true
heading_anchors: true

aux_links:
  "View on GitHub":
    - "https://github.com/Arawn-Davies/makar"

enable_copy_code_button: true
aux_links_new_tab: true

plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true

exclude:
  - vendor
